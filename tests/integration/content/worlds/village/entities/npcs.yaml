  start_location: millbrook_home
  role: blacksmith
  personality: Грубоватая, но справедливая.
  settlement_id: millbrook
sergei:
  name: Стражник Сергей
  start_location: millbrook_barracks
  role: guard
  personality: Дисциплинированный и серьёзный.
  settlement_id: millbrook
  triggers:
  - id: war_duty
    'on':
      event: war_declared
      match:
        aggressor_id: north
        target_id: south
    until:
      event: peace_declared
      match:
        nation_a_id: north
        nation_b_id: south
masha:
  name: Маша-торговка
