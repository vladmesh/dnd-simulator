    type: potion
    heal_dice: 2d4+2
    price: 50
  - name: Dagger
    type: weapon
    weapon_id: dagger
    category: simple
    attack_name: stab
    damage:
    - dice: 1d4
      type: piercing
    ability: dex
    is_finesse: true
    price: 10
