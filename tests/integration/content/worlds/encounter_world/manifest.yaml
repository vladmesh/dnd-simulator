name: Encounter Test World
description: >
  Minimal world for testing region encounter tables. Region "wilds" carries a
  regional goblin table; its "wild_den" location overrides with its own wolf
  table; region "borderlands" has no table at all. A factionless player can
  enter each location and observe which table rolls.

