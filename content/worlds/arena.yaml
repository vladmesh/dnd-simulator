name: Blood Arena
description: >
  A gladiatorial arena with walls. Four fighters, no allies. Last one standing wins.

regions:
  arena:
    name: Кровавая Арена
    latitude: 40.0
    longitude: 0.0
    elevation: 50
    terrain: plains
    water_proximity: 0.0
    connections: []
    settlements: []
    battle_map:
      width: 80
      height: 80
      walls:
        # Central cross-shaped wall with gaps
        - [40, 0, 40, 30]    # vertical wall, south half
        - [40, 50, 40, 80]   # vertical wall, north half (gap 30-50 in middle)
        - [0, 40, 25, 40]    # horizontal wall, west half
        - [55, 40, 80, 40]   # horizontal wall, east half (gap 25-55 in middle)

nations: {}

player:
  name: Kael
  race: half_orc
  class: fighter
  level: 3
  alignment: chaotic_neutral
  appearance: "огромный полуорк в шипастых наплечниках, со шрамом через всё лицо"
  ability_scores:
    str: 18
    dex: 14
    con: 16
    int: 8
    wis: 10
    cha: 10
  hp: 30
  ac: 16
  gold: 0
  start_region: arena
  attacks:
    - name: greataxe
      ability: str
      damage:
        - dice: "1d12"
          type: slashing

npcs:
  razor:
    name: Разор Безумный
    region_id: arena
    role: gladiator
    race: dragonborn
    class: barbarian
    hp: 35
    ac: 13
    ability_scores:
      str: 18
      dex: 12
      con: 16
      int: 6
      wis: 8
      cha: 10
    personality: >
      Ты — Разор, драконорождённый берсерк на Кровавой Арене.
      Здесь каждый сам за себя. Убей или умри.
      Ты атакуешь ближайшего врага с яростью. Никаких переговоров.
      Если враг далеко — беги к нему. Если рядом — бей.
      Предпочитаешь бить самого раненого — добивать слабых.
    attacks:
      - name: greatsword
        ability: str
        damage:
          - dice: "2d6"
            type: slashing

  shadow:
    name: Тень Ночная
    region_id: arena
    role: gladiator
    race: elf
    class: rogue
    hp: 20
    ac: 15
    ability_scores:
      str: 10
      dex: 18
      con: 12
      int: 14
      wis: 14
      cha: 12
    personality: >
      Ты — Тень, эльфийка-ассасин на Кровавой Арене.
      Здесь каждый сам за себя. Убей или умри.
      Ты хитрая и расчётливая. Держишься на расстоянии, стреляешь из лука.
      Если враг подходит вплотную — отступаешь (move away).
      Атакуешь самого опасного противника. Не лезешь в ближний бой.
      Используй стены как укрытие — стой за стеной и стреляй через проёмы.
    attacks:
      - name: shortbow
        ability: dex
        reach: 80
        damage:
          - dice: "1d6"
            type: piercing
      - name: dagger
        ability: dex
        damage:
          - dice: "1d4"
            type: piercing

  iron:
    name: Железный Горн
    region_id: arena
    role: gladiator
    race: dwarf
    class: fighter
    hp: 40
    ac: 18
    speed: 25
    ability_scores:
      str: 16
      dex: 8
      con: 18
      int: 10
      wis: 14
      cha: 8
    personality: >
      Ты — Железный Горн, дварф-танк на Кровавой Арене.
      Здесь каждый сам за себя. Убей или умри.
      Ты медленный но несокрушимый. Идёшь к ближайшему врагу и бьёшь.
      Если сильно ранен — уходишь в dodge, чтобы перевести дух.
      Потом снова идёшь в бой. Никогда не бежишь.
      Помни про стены — обходи их через проёмы.
    attacks:
      - name: warhammer
        ability: str
        damage:
          - dice: "1d10"
            type: bludgeoning
