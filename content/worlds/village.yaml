name: Quiet Village
description: >
  A small village for testing RuleBrain canned dialogue.
  All NPCs are rule-based — no LLM needed.

regions:
  village:
    name: Тихая Деревня
    latitude: 45.0
    longitude: 10.0
    elevation: 200
    terrain: plains
    water_proximity: 0.3
    connections: []
    settlements:
      - id: millbrook
        name: Мельничный Ручей
        type: village
        population: 120

nations: {}

