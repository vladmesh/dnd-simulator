templates:
  goblin:
    base: goblin

  goblin_boss:
    base: goblin_boss

  wolf:
    base: wolf

  dire_wolf:
    base: dire_wolf

  bandit:
    base: bandit

  guard:
    base: guard

  orc:
    base: orc

  orc_war_chief:
    base: orc_war_chief

# Per-location tables — the dangerous travel spaces between towns. Settlements
# stay safe (no tables). Danger is fixed by place and time, never scaled to the
# party (kenshi-style).
encounters:
  silverport_greenwood_road:
    - template: goblin
      chance: 0.4
      count: [1, 3]
    - template: wolf
      chance: 0.2
      count: [2, 4]
    - template: dire_wolf
      chance: 0.25
      count: [1, 1]
      time_of_day: night

  silverport_highfield_road:
    - template: bandit
      chance: 0.2
      count: [1, 2]

  greenwood_highfield_road:
    - template: wolf
      chance: 0.3
      count: [1, 3]
    - template: goblin
      chance: 0.2
      count: [1, 2]

  highfield_iron_road:
    - template: bandit
      chance: 0.2
      count: [1, 2]
    - template: orc
      chance: 0.15
      count: [1, 2]

  highfield_bogmire_road:
    - template: bandit
      chance: 0.3
      count: [1, 2]
    - template: dire_wolf
      chance: 0.2
      count: [1, 1]
      time_of_day: night

  highfield_town_fields:
    - template: wolf
      chance: 0.2
      count: [1, 2]

  iron_peaks_north_pass:
    - template: orc
      chance: 0.3
      count: [1, 3]
    - template: dire_wolf
      chance: 0.2
      count: [1, 2]
      time_of_day: night

  bogmire_dustmere_road:
    - template: bandit
      chance: 0.2
      count: [1, 2]
    - template: orc
      chance: 0.25
      count: [1, 2]

  fishing_hamlet_shore:
    - template: wolf
      chance: 0.15
      count: [1, 2]

# Region-level fallback: any location in frostholm without its own table uses
# this. The frozen tundra is wolf country; dire wolves hunt only after dark.
region_encounters:
  frostholm:
    - template: wolf
      chance: 0.4
      count: [2, 3]
    - template: dire_wolf
      chance: 0.3
      count: [1, 2]
      time_of_day: night
