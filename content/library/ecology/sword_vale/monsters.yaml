templates:
  goblin:
    base: goblin

  wolf:
    base: wolf

  bandit:
    base: bandit

  guard:
    base: guard

  goblin_chieftain:
    name: {en: Goblin Chieftain, ru: Гоблин-вожак}
    faction: goblin_tribe
    hp: 21
    ac: 15
    speed: 30
    ability_scores: {str: 15, dex: 14, con: 14, int: 10, wis: 9, cha: 10}
    attacks:
      - name: scimitar
        ability: dex
        damage:
          - dice: "1d6"
            type: slashing
        reach: 5
    cr: 1.0

  bandit_leader:
    name: {en: Bandit Leader, ru: Главарь бандитов}
    faction: bandits
    hp: 52
    ac: 15
    speed: 30
    ability_scores: {str: 15, dex: 16, con: 14, int: 14, wis: 11, cha: 14}
    attacks:
      - name: shortsword
        ability: dex
        damage:
          - dice: "1d6"
            type: piercing
        reach: 5
    cr: 2.0

  orc:
    name: {en: Orc, ru: Орк}
    faction: orc_warband
    hp: 15
    ac: 13
    speed: 30
    ability_scores: {str: 16, dex: 12, con: 16, int: 7, wis: 11, cha: 10}
    attacks:
      - name: greataxe
        ability: str
        damage:
          - dice: "1d12"
            type: slashing
        reach: 5
    cr: 0.5

  orc_warchief:
    name: {en: Orc Warchief, ru: Орк-вождь}
    faction: orc_warband
    hp: 93
    ac: 16
    speed: 30
