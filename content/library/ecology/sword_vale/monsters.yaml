templates:
  goblin:
    base: goblin

  goblin_boss:
    base: goblin_boss

  goblin_chieftain:
    name: {en: Goblin Chieftain, ru: Гоблин-вожак}
    faction: goblin_tribe
    hp: 21
    ac: 15
    speed: 30
    ability_scores: {str: 15, dex: 14, con: 14, int: 10, wis: 9, cha: 10}
    attacks:
      - name: scimitar
        ability: dex
        damage:
          - dice: "1d6"
            type: slashing
        reach: 5
    cr: 1.0

  wolf:
    base: wolf

  dire_wolf:
    base: dire_wolf

  bandit:
    base: bandit

  bandit_leader:
    name: {en: Bandit Leader, ru: Главарь бандитов}
    faction: bandits
    hp: 52
    ac: 15
    speed: 30
    ability_scores: {str: 15, dex: 16, con: 14, int: 14, wis: 11, cha: 14}
    attacks:
      - name: shortsword
        ability: dex
        damage:
          - dice: "1d6"
            type: piercing
        reach: 5
    cr: 2.0

  guard:
    base: guard

  orc:
    base: orc

  orc_war_chief:
    base: orc_war_chief

# Per-location tables — the dangerous travel spaces between towns. Settlements
# stay safe (no tables). Danger is fixed by place and time, never scaled to the
# party (kenshi-style).
encounters:
  silverport_greenwood_road:
    - template: goblin
      chance: 0.4
      count: [1, 3]
    - template: wolf
      chance: 0.2
      count: [2, 4]
    - template: dire_wolf
      chance: 0.25
      count: [1, 1]
      time_of_day: night

  silverport_highfield_road:
    - template: bandit
      chance: 0.2
      count: [1, 2]

  greenwood_highfield_road:
    - template: wolf
      chance: 0.3
      count: [1, 3]
    - template: goblin
      chance: 0.2
      count: [1, 2]

  highfield_iron_road:
    - template: bandit
      chance: 0.2
      count: [1, 2]
    - template: orc
      chance: 0.15
      count: [1, 2]

  highfield_bogmire_road:
    - template: bandit
      chance: 0.3
      count: [1, 2]
    - template: dire_wolf
      chance: 0.2
      count: [1, 1]
      time_of_day: night

  highfield_town_fields:
    - template: wolf
      chance: 0.2
      count: [1, 2]

  iron_peaks_north_pass:
    - template: orc
      chance: 0.3
      count: [1, 3]
    - template: dire_wolf
      chance: 0.2
      count: [1, 2]
      time_of_day: night

  bogmire_dustmere_road:
    - template: bandit
      chance: 0.2
      count: [1, 2]
    - template: orc
      chance: 0.25
      count: [1, 2]

  fishing_hamlet_shore:
    - template: wolf
      chance: 0.15
      count: [1, 2]

region_encounters:
  greenwood:
    - template: wolf
      chance: 0.2
      count: [1, 2]

  iron_peaks:
    - template: orc
      chance: 0.3
      count: [1, 3]

  bogmire:
    - template: goblin
      chance: 0.15
      count: [1, 2]

  frostholm:
    - template: wolf
      chance: 0.4
      count: [2, 3]
    - template: dire_wolf
      chance: 0.3
      count: [1, 2]
      time_of_day: night
