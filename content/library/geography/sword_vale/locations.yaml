highfield_town_home:
  name:
    en: "Highfield Homes"
    ru: "Дома Высокополья"
  region: highfield
  settlement: highfield_town
  description:
    en: "Simple stone cottages along dirt lanes."
    ru: "Простые каменные домики вдоль грунтовых дорог."
