      distance: 500
    - target: greenwood_village_edge
      distance: 125000
    - target: goblin_cave
      distance: 2000

goblin_cave:
  name:
    en: "Goblin Cave"
    ru: "Пещера гоблинов"
  region: silverport
  description:
    en: "A dark cleft in the hillside reeking of smoke and rot. Crude totems mark the entrance."
    ru: "Тёмная расщелина в склоне холма, пропахшая дымом и гнилью. У входа торчат грубые тотемы."
  neighbors:
    - target: silverport_greenwood_road
      distance: 2000

