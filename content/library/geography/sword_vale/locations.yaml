# === Silverport City ===

silverport_city_tavern:
  name:
    en: "The Salty Anchor"
    ru: "Солёный Якорь"
  region: silverport
  settlement: silverport_city
  description:
    en: "A rowdy dockside tavern. The smell of ale and fried fish fills the air."
    ru: "Шумная портовая таверна. В воздухе витает запах эля и жареной рыбы."
  neighbors:
    - target: silverport_city_market
      distance: 200
    - target: silverport_city_docks
      distance: 100

silverport_city_market:
  name:
    en: "Silverport Market Square"
    ru: "Рыночная площадь Серебропорта"
  region: silverport
  settlement: silverport_city
  description:
    en: "A bustling open-air market near the city center."
    ru: "Оживлённый рынок под открытым небом в центре города."
  neighbors:
    - target: silverport_city_tavern
      distance: 200
    - target: silverport_city_smithy
      distance: 150
    - target: silverport_city_gate
      distance: 300

silverport_city_smithy:
  name:
    en: "Edgar's Smithy"
    ru: "Кузница Эдгара"
  region: silverport
  settlement: silverport_city
  description:
    en: "A soot-covered forge near the eastern wall. The clang of hammer on anvil rings out."
    ru: "Покрытая копотью кузница у восточной стены. Раздаётся звон молота о наковальню."
  neighbors:
    - target: silverport_city_market
      distance: 150

silverport_city_docks:
  name:
    en: "Silverport Docks"
    ru: "Доки Серебропорта"
  region: silverport
  settlement: silverport_city
  description:
    en: "Creaking wooden piers stretch into the grey harbor. Fishing boats bob in the waves."
    ru: "Скрипучие деревянные причалы тянутся в серую гавань. Рыбацкие лодки покачиваются на волнах."
  neighbors:
    - target: silverport_city_tavern
      distance: 100

silverport_city_gate:
  name:
    en: "Silverport City Gates"
    ru: "Городские ворота Серебропорта"
  region: silverport
  settlement: silverport_city
  description:
    en: "Stone gatehouse with heavy iron-bound doors. Guards stand watch."
    ru: "Каменная надвратная башня с тяжёлыми окованными железом дверями. Стража стоит на посту."
  neighbors:
    - target: silverport_city_market
      distance: 300
    - target: silverport_city_barracks
      distance: 50
    - target: fishing_hamlet_shore
      distance: 3000
    - target: silverport_greenwood_road
      distance: 500
    - target: silverport_highfield_road
      distance: 500

silverport_city_barracks:
  name:
    en: "City Barracks"
    ru: "Городские казармы"
  region: silverport
  settlement: silverport_city
  description:
    en: "A stone building beside the gates. The city guard musters here."
    ru: "Каменное здание рядом с воротами. Здесь собирается городская стража."
  neighbors:
    - target: silverport_city_gate
      distance: 50

silverport_city_home:
  name:
    en: "Residential Quarter"
    ru: "Жилой квартал"
  region: silverport
  settlement: silverport_city
  description:
    en: "Narrow streets of timber-framed houses behind the market."
    ru: "Узкие улочки фахверковых домов за рынком."
  neighbors:
    - target: silverport_city_market
      distance: 200

# === Fishing Hamlet ===

fishing_hamlet_shore:
  name:
    en: "Fishing Hamlet Shore"
    ru: "Берег Рыбацкого Хутора"
  region: silverport
  settlement: fishing_hamlet
  description:
    en: "A cluster of huts on a rocky beach south of the city."
    ru: "Скопление хижин на скалистом берегу к югу от города."
  neighbors:
    - target: silverport_city_gate
      distance: 3000

# === Roads from Silverport ===

silverport_highfield_road:
  name:
    en: "East Road to Highfield"
    ru: "Восточный тракт к Высокополью"
  region: silverport
  description:
    en: "A well-worn trade road heading east through rolling hills."
    ru: "Протоптанный торговый тракт, ведущий на восток через пологие холмы."
  neighbors:
    - target: silverport_city_gate
      distance: 500
    - target: highfield_town_gate
      distance: 155000

silverport_greenwood_road:
  name:
    en: "Forest Road to Greenwood"
    ru: "Лесная дорога к Зеленолесью"
  region: silverport
  description:
    en: "A narrow path winding southeast into dark woods."
    ru: "Узкая тропа, петляющая на юго-восток в тёмные леса."
  neighbors:
