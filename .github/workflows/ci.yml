name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Required gate: backend lint + types + tests.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest --cov=src/dnd_simulator

  # Required gate: frontend types + unit tests (mirrors `make check`).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  # Non-required (informational until the existing failures are cleared).
  # eslint currently fails on pre-existing violations (shadcn ui exports,
  # set-state-in-effect, unused vars); not in `make check`.
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/

  # Non-required (informational until the test fixtures are fixed).
  # Currently red on main: e.g. world 'arena' manifest declares a custom
  # 'ecology' layer with no content dir -> 500 on session create.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests
        run: make test-integration
