<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title">D&D Simulator</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .lang-flags { display: flex; justify-content: center; gap: 0.75rem; margin-bottom: 1rem; }
        .lang-flag { cursor: pointer; font-size: 1.6rem; opacity: 0.4; transition: opacity 0.15s; padding: 0.2rem 0.4rem; border-radius: 4px; border: 2px solid transparent; }
        .lang-flag:hover { opacity: 0.7; }
        .lang-flag.active { opacity: 1; border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="center-page">
        <h1 data-i18n="app.title">D&D Simulator</h1>
        <p class="text-dim" data-i18n="app.subtitle">Debug UI</p>
        <div class="lang-flags">
            <span class="lang-flag" data-lang="en" title="English">&#127468;&#127463;</span>
            <span class="lang-flag" data-lang="ru" title="Русский">&#127479;&#127482;</span>
        </div>
        <div class="role-cards">
            <a href="/master.html" class="role-card">
                <h2 data-i18n="app.master">Master</h2>
                <p data-i18n="app.master.desc">Create worlds, manage sessions, control NPCs</p>
            </a>
            <a href="/player.html" class="role-card">
                <h2 data-i18n="app.player">Player</h2>
                <p data-i18n="app.player.desc">Join a session, create a character, play</p>
            </a>
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script>
    (() => {
        function detectLang() {
            const saved = localStorage.getItem('dnd_lang');
            if (saved) return saved;
            const nav = (navigator.language || '').toLowerCase();
            if (nav.startsWith('ru')) return 'ru';
            return 'en';
        }

        function setActiveLang(lang) {
            document.querySelectorAll('.lang-flag').forEach(el => {
                el.classList.toggle('active', el.dataset.lang === lang);
            });
        }

        const lang = detectLang();
        localStorage.setItem('dnd_lang', lang);
        setActiveLang(lang);
        I18n.init(lang).then(() => { document.title = I18n.t('app.title'); });

        document.querySelectorAll('.lang-flag').forEach(el => {
            el.addEventListener('click', () => {
                const newLang = el.dataset.lang;
                localStorage.setItem('dnd_lang', newLang);
                setActiveLang(newLang);
                I18n.init(newLang).then(() => { document.title = I18n.t('app.title'); });
            });
        });
    })();
    </script>
</body>
</html>
